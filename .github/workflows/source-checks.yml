name: Source and signing checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check source and regression tests
        run: |
          python3 scripts/device-build.py check-source
          python3 -m unittest discover -s tests -v
          bash -n scripts/verify-release.sh
      - name: Test real signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake zstd gawk
          python3 scripts/build-signing-test-tools.py "$RUNNER_TEMP/signing-tools"
          OP_SOURCE_SIGNING_TOOLS="$RUNNER_TEMP/signing-tools/install/bin" \
            python3 -m unittest discover -s tests -p test_signing_integration.py -v
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
